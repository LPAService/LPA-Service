services:
  postgres:
    image: postgres:16-alpine
    container_name: lpa-leo-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: lpa_leo
      POSTGRES_USER: lpa
      POSTGRES_PASSWORD: lpa
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U lpa -d lpa_leo"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  postgres-data:

